# Throwaway Postgres + Redis for `npm run test:e2e` (tmpfs: nothing persists).
name: ai-cv-builder-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvbuilder
      POSTGRES_PASSWORD: cvbuilder
      POSTGRES_DB: cvbuilder_test
    # Host ports are configurable: other local projects may hold the defaults.
    # Pass the same ports to the tests via DATABASE_URL/REDIS_URL (see test/harness.ts).
    ports: ["${TEST_POSTGRES_PORT:-5433}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvbuilder -d cvbuilder_test"]
      interval: 2s
      retries: 30
  redis-test:
    image: redis:7-alpine
    ports: ["${TEST_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
